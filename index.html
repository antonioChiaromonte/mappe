<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mappe concettuali</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400&display=swap"><style>
:root{--bg:#fbf7f1;--surface:#fff;--ink:#2b2420;--ink2:#544941;--muted:#76695d;--line:#ece3d7;--accent:#a9520d;--fill:#b85a0f;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1714;--surface:#25201c;--ink:#f2eae0;--ink2:#d6cabd;--muted:#b5a798;--line:#3a312a;--accent:#ff8f65;--fill:#ff8f65;--on:#1d1d1d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'EB Garamond',Garamond,serif;font-size:19px;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:56px 16px 80px}h1{font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.08;margin:6px 0 12px}
.eyebrow{font-style:italic;color:var(--muted)}p{color:var(--ink2)}a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;margin:6px 8px 6px 0}
.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--on)}
.list{display:grid;gap:14px;margin-top:28px;padding:0;list-style:none}
.list a{display:block;padding:20px 24px;border-radius:15px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list a:hover{border-color:var(--accent)}.list b{display:block;font-size:24px;font-weight:500}.list small{color:var(--muted)}
[hidden]{display:none!important}</style></head>
<body><main><span class="eyebrow">Pubblicate con l'app Mappe</span><h1>Mappe concettuali</h1>
<ul class="list"><li><a href="./programmazione-fisica-cpp/"><b>Programmazione per la Fisica</b><span>C++ · F. Giacomini · Università di Bologna · A.A. 2024/2025</span><br><small>96 concetti · aggiornata il 06/11/2026</small></a></li></ul>
</main></body></html>
