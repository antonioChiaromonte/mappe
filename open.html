<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apri in Mappe</title><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400&display=swap"><style>
:root{--bg:#fbf7f1;--surface:#fff;--ink:#2b2420;--ink2:#544941;--muted:#76695d;--line:#ece3d7;--accent:#a9520d;--fill:#b85a0f;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1714;--surface:#25201c;--ink:#f2eae0;--ink2:#d6cabd;--muted:#b5a798;--line:#3a312a;--accent:#ff8f65;--fill:#ff8f65;--on:#1d1d1d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'EB Garamond',Garamond,serif;font-size:19px;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:56px 16px 80px}h1{font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.08;margin:6px 0 12px}
.eyebrow{font-style:italic;color:var(--muted)}p{color:var(--ink2)}a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;margin:6px 8px 6px 0}
.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--on)}
.list{display:grid;gap:14px;margin-top:28px;padding:0;list-style:none}
.list a{display:block;padding:20px 24px;border-radius:15px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list a:hover{border-color:var(--accent)}.list b{display:block;font-size:24px;font-weight:500}.list small{color:var(--muted)}
[hidden]{display:none!important}</style></head>
<body><main>
<span class="eyebrow" id="eyebrow">Link a una mappa concettuale</span>
<h1 id="title">Apertura in Mappe…</h1>
<p id="msg">Se il browser chiede di aprire l'app Mappe, conferma.</p>
<div id="actions" hidden>
  <a class="btn dark" id="app" href="#">Apri nell'app Mappe</a>
  <a class="btn" id="web" href="#" hidden>Leggi la versione web</a>
</div>
<p id="note" hidden><small>Il link all'app funziona sui computer dove Mappe è installata. La versione web è in sola lettura.</small></p>
</main>
<script>
(function () {
  var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  var m = /^([a-z0-9]+(?:-[a-z0-9]+)*)(?:\/([a-z0-9]+(?:-[a-z0-9]+)*))?\/?$/.exec(h);
  var $ = function (id) { return document.getElementById(id); };
  if (!m) { $("title").textContent = "Link non valido"; $("msg").innerHTML = 'Torna all\'<a href="./">elenco delle mappe</a>.'; return; }
  var slug = m[1], id = m[2];
  var app = "mappe://" + slug + (id ? "/" + id : "");
  var web = "./" + slug + "/#/" + slug + (id ? "/" + id : "");
  $("app").href = app;
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var showOptions = function (webOk) {
    $("title").textContent = webOk ? "Scegli come aprirla" : "Apri nell'app Mappe";
    $("msg").textContent = webOk ? "" : "Questa mappa non è pubblicata sul web: si apre solo dall'app Mappe sul computer dove è salvata.";
    $("actions").hidden = false; $("note").hidden = false;
    if (webOk) { $("web").href = web; $("web").hidden = false; }
    if (mobile) $("app").hidden = true;
  };
  fetch("./" + slug + "/data.json", { method: "HEAD", cache: "no-store" }).then(function (r) { return r.ok; }, function () { return false; }).then(function (webOk) {
    if (mobile) { if (webOk) location.replace(web); else showOptions(false); return; }
    var left = false;
    window.addEventListener("blur", function () { left = true; });
    document.addEventListener("visibilitychange", function () { if (document.hidden) left = true; });
    location.href = app;
    setTimeout(function () { showOptions(webOk); if (left) $("title").textContent = "Aperta in Mappe"; }, 1600);
  });
})();
</script>
</body></html>
